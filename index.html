<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4338CA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Leave">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234338CA'/%3E%3Cstop offset='1' stop-color='%23EC4899'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Crect x='14' y='14' width='16' height='16' rx='5' fill='%232DD4BF'/%3E%3Crect x='34' y='14' width='16' height='16' rx='5' fill='%23FFB020'/%3E%3Crect x='14' y='34' width='16' height='16' rx='5' fill='%23C084FC'/%3E%3Crect x='34' y='34' width='16' height='16' rx='5' fill='white'/%3E%3C/svg%3E">
<title>Annual Leave</title>
<style>
  :root {
    --ink:#1E1B4B; --mute:#64648A; --bg:#F5F3FF; --card:#fff; --line:#E7E4F8;
    --indigo:#4338CA; --violet:#7C3AED; --pink:#EC4899;
    --mint:#2DD4BF; --mintDeep:#0F9D8E; --amber:#FFB020; --lav:#C084FC; --rose:#F43F5E; --sky:#38BDF8;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); }
  body { font-family:ui-rounded,"SF Pro Rounded","Nunito","Trebuchet MS","Segoe UI",system-ui,sans-serif; color:var(--ink); }
  #app { max-width:560px; margin:0 auto; min-height:100vh; padding-bottom:calc(96px + env(safe-area-inset-bottom)); }

  /* header */
  .top { background:linear-gradient(135deg,#4338CA 0%,#7C3AED 55%,#EC4899 100%); color:#fff; padding:calc(22px + env(safe-area-inset-top)) 20px 78px; border-radius:0 0 28px 28px; }
  .top h1 { margin:0; font-size:26px; font-weight:800; letter-spacing:-.02em; }
  .top p { margin:4px 0 0; font-size:14px; opacity:.85; }
  .body { padding:0 14px; margin-top:-56px; }

  /* cards */
  .card { background:var(--card); border-radius:22px; padding:18px; margin-top:14px; box-shadow:0 6px 20px rgba(67,56,202,.08); }
  .card h2 { font-size:16px; margin:0 0 12px; font-weight:800; }
  .sub { color:var(--mute); font-size:13px; line-height:1.4; margin-top:4px; }

  /* days hero */
  .hero { padding:20px 18px 18px; }
  .heroTop { display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:14px; gap:10px; }
  .big { font-size:64px; line-height:.9; font-weight:900; letter-spacing:-.04em; color:var(--mintDeep); }
  .big.neg { color:var(--rose); }
  .bigLbl { font-size:15px; font-weight:700; margin-top:6px; }
  .ifAll { text-align:right; font-size:13px; color:var(--mute); }
  .ifAll b { display:block; font-size:22px; color:var(--ink); }
  .pips { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .pip { aspect-ratio:1; border-radius:11px; }
  .pip.lbl { border:0; padding:2px 1px; font:inherit; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; line-height:1.05; overflow:hidden; }
  .pip.lbl b { font-size:11px; font-weight:900; white-space:nowrap; }
  .pip.lbl small { font-size:8px; font-weight:700; margin-top:2px; max-height:2.1em; overflow:hidden; word-break:break-word; }
  .pip.bh { background:var(--lav); color:#3B0764; }
  .pip.taken { background:var(--indigo); }
  .pip.pending { background:var(--amber); }
  .pip.pending.lbl { color:#4A2E00; }
  .pip.taken.lbl { color:#fff; }
  .wheelRow { display:flex; align-items:center; gap:16px; }
  .wheelRow svg { flex:none; }
  .wlist { flex:1; min-width:0; }
  .wrow { display:flex; align-items:center; gap:8px; padding:7px 0; font-size:14px; font-weight:600; border-bottom:1px solid var(--line); }
  .wrow:last-child { border-bottom:0; }
  .wrow i { flex:none; width:12px; height:12px; border-radius:4px; display:block; }
  .wrow span { flex:1; }
  .wrow b { font-variant-numeric:tabular-nums; font-weight:800; }
  .anim .arc { animation:draw .9s cubic-bezier(.3,.7,.2,1) both; }
  @keyframes draw { from { stroke-dasharray:0 var(--c); } }
  @media (prefers-reduced-motion: reduce) { .anim .arc { animation:none; } }
  .blks { margin-top:12px; display:flex; flex-direction:column; gap:6px; }
  .blk { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; background:#F5F3FF; border-radius:12px; padding:8px 10px; }
  .blk i { flex:none; width:12px; height:12px; border-radius:4px; display:block; }
  .blk span b { font-weight:800; }
  .pip.free { background:var(--mint); }
  .anim .pip { animation:pop .38s cubic-bezier(.2,1.4,.4,1) both; animation-delay:calc(var(--i) * 16ms); }
  @keyframes pop { from { transform:scale(.2); opacity:0; } to { transform:scale(1); opacity:1; } }
  @media (prefers-reduced-motion: reduce) { .anim .pip { animation:none; } }
  .legend { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
  .lg { display:flex; align-items:center; gap:6px; font-size:13px; font-weight:600; background:#F5F3FF; border-radius:20px; padding:5px 11px 5px 8px; }
  .lg i { width:12px; height:12px; border-radius:4px; display:block; }
  .nudge { display:flex; align-items:center; gap:12px; }
  .nudge .nt { flex:1; min-width:0; }
  .nudge b { display:block; font-size:16px; font-weight:800; }
  .nudge span { font-size:13px; font-weight:600; opacity:.85; }
  .nudge button { flex:none; border:0; border-radius:14px; padding:10px 14px; font:inherit; font-weight:800; font-size:14px; cursor:pointer; color:#fff; }
  .warn { background:#FFF1F2; color:#BE123C; font-size:14px; font-weight:600; }

  /* year strip */
  .strip { position:relative; height:34px; border-radius:12px; overflow:hidden; display:flex; }
  .strip .m { flex:1; }
  .strip .m:nth-child(odd) { background:#EEF2FF; }
  .strip .m:nth-child(even) { background:#F5EEFF; }
  .strip .mk { position:absolute; top:0; bottom:0; }
  .strip .lv { position:absolute; top:5px; bottom:5px; border-radius:6px; }
  .strip .today { position:absolute; top:0; bottom:0; width:3px; background:var(--pink); }
  .mlab { display:flex; margin-top:5px; }
  .mlab div { flex:1; text-align:center; font-size:11px; font-weight:700; color:var(--mute); }

  /* next up */
  .next { background:linear-gradient(135deg,#FFF7E0,#FFE9F1); }
  .nrow { display:flex; align-items:center; gap:14px; }
  .dbadge { flex:none; width:54px; height:58px; border-radius:16px; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.05; }
  .dbadge b { font-size:22px; font-weight:900; }
  .dbadge span { font-size:12px; font-weight:700; }

  /* other absence */
  .tiles { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .tile { border-radius:16px; padding:12px 8px; text-align:center; }
  .tile b { display:block; font-size:24px; font-weight:900; }
  .tile span { font-size:12px; font-weight:700; }

  /* forms */
  label { display:block; font-size:13px; font-weight:700; color:var(--mute); margin-bottom:5px; }
  input[type=text], input[type=number], input[type=date], select { width:100%; font:inherit; font-size:16px; padding:11px 12px; border:2px solid var(--line); border-radius:14px; background:#FBFAFF; color:var(--ink); min-height:48px; }
  input:focus, select:focus { outline:none; border-color:var(--violet); background:#fff; }
  button:focus-visible { outline:3px solid var(--pink); outline-offset:2px; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px; }
  .btn { border:0; background:linear-gradient(135deg,#4338CA,#7C3AED); color:#fff; font:inherit; font-weight:800; padding:14px 16px; border-radius:16px; width:100%; cursor:pointer; font-size:16px; box-shadow:0 6px 14px rgba(124,58,237,.3); }
  .btn:active { transform:scale(.98); }
  .btn.soft { background:#EEF2FF; color:var(--indigo); box-shadow:none; margin-top:8px; }
  .btn.danger { background:linear-gradient(135deg,#F43F5E,#EC4899); box-shadow:0 6px 14px rgba(244,63,94,.25); }
  .btn.ghost { background:transparent; color:var(--rose); width:auto; padding:8px 10px; font-size:13px; font-weight:700; box-shadow:none; }
  .check { display:flex; align-items:center; gap:10px; color:var(--ink); margin-bottom:12px; font-size:15px; font-weight:600; }
  .check input { width:22px; height:22px; accent-color:var(--violet); }
  .err { color:#BE123C; font-size:14px; font-weight:600; margin:6px 0 10px; }
  .err:empty { display:none; }
  .preview { background:#ECFDF9; color:#0B7A6D; font-weight:700; font-size:14px; border-radius:12px; padding:10px 12px; margin-bottom:12px; }
  .preview:empty { display:none; }

  /* leave list */
  .leave { display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); }
  .leave:last-child { border-bottom:0; }
  .lbody { flex:1; min-width:0; }
  .ltitle { font-size:15px; font-weight:800; display:flex; justify-content:space-between; gap:8px; }
  .lact { display:flex; justify-content:space-between; align-items:center; margin-top:8px; }
  .statusSel { width:auto; font-size:13px; font-weight:800; padding:6px 10px; border:none; border-radius:20px; min-height:34px; }
  .empty { color:var(--mute); font-size:14px; padding:8px 0; }
  .stat { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); font-size:14px; gap:8px; }
  .stat:last-child { border-bottom:0; }
  .chip { display:inline-block; font-size:12px; padding:3px 10px; border-radius:20px; font-weight:800; }

  /* bottom nav */
  .nav { position:fixed; left:0; right:0; bottom:0; display:flex; justify-content:center; padding:0 14px calc(12px + env(safe-area-inset-bottom)); pointer-events:none; }
  .navIn { pointer-events:auto; width:100%; max-width:420px; background:#fff; border-radius:24px; display:flex; padding:6px; gap:4px; box-shadow:0 10px 30px rgba(30,27,75,.22); }
  .tab { flex:1; border:0; background:transparent; padding:9px 4px 7px; border-radius:18px; font:inherit; font-size:12px; font-weight:700; color:var(--mute); cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px; }
  .tab svg { width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .tab[aria-selected="true"] { background:linear-gradient(135deg,#4338CA,#7C3AED); color:#fff; }

  .toast { max-width:90%; text-align:center; position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:var(--ink); color:#fff; font-weight:700; font-size:14px; padding:10px 18px; border-radius:20px; z-index:10; }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  "use strict";
  var KEY = "annual-leave-tracker-v1";
  var TYPES = ["Annual Leave", "Sick", "Unpaid", "Other"];
  var STATUSES = ["Pending", "Approved", "Rejected"];
  var MONTHS = ["J","F","M","A","M","J","J","A","S","O","N","D"];
  var TYPE_COL = {
    "Annual Leave":["#E0E7FF","#4338CA"], "Sick":["#FFE4E6","#BE123C"], "Unpaid":["#E2E8F0","#475569"], "Other":["#FEF3C7","#B45309"]
  };

  // ---- storage (falls back to memory if the browser blocks it) ----
  var memory = null;
  // England & Wales bank holidays (Scotland / N. Ireland differ - edit in Settings)
  var EW = [
    ["2026-01-01","New Year's Day"],["2026-04-03","Good Friday"],["2026-04-06","Easter Monday"],
    ["2026-05-04","Early May bank holiday"],["2026-05-25","Spring bank holiday"],["2026-08-31","Summer bank holiday"],
    ["2026-12-25","Christmas Day"],["2026-12-28","Boxing Day (substitute)"],
    ["2027-01-01","New Year's Day"],["2027-03-26","Good Friday"],["2027-03-29","Easter Monday"],
    ["2027-05-03","Early May bank holiday"],["2027-05-31","Spring bank holiday"],["2027-08-30","Summer bank holiday"],
    ["2027-12-27","Christmas Day (substitute)"],["2027-12-28","Boxing Day (substitute)"]
  ];
  function ewList() { return EW.map(function (h) { return { date:h[0], name:h[1] }; }); }
  function defaults() {
    return { seeded:true, settings:{ name:"", year:new Date().getFullYear(), entitlement:28, includesBH:true, carry:0, taken:13, hours:8 }, leaves:[], holidays:ewList() };
  }
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var d = JSON.parse(raw), def = defaults();
        var out = { seeded:true, settings:Object.assign(def.settings, d.settings), leaves:d.leaves||[], holidays:d.holidays||[] };
        if (!d.seeded) {
          if (out.holidays.length === 0) out.holidays = ewList();
          if (Number(out.settings.entitlement) === 25) out.settings.entitlement = 28;
        }
        return out;
      }
    } catch (e) { if (memory) return memory; }
    return defaults();
  }
  function save() {
    memory = data;
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {}
  }

  var data = load();
  var tab = "overview";
  var form = { start:"", end:"", type:"Annual Leave", half:false, status:"Pending", notes:"" };
  var error = "";
  var hol = { date:"", name:"" };
  var animate = true; // pips pop in once when the app opens

  // ---- helpers ----
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function toStr(d) { return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
  function parse(s) { var p = s.split("-").map(Number); return new Date(p[0], p[1]-1, p[2]); }
  function fmt(s, y) {
    var o = { weekday:"short", day:"numeric", month:"short" };
    if (y) o.year = "numeric";
    return parse(s).toLocaleDateString("en-GB", o);
  }
  function mon(s) { return parse(s).toLocaleDateString("en-GB", { month:"short" }); }
  function num(n) { return String(Math.round(n * 10) / 10); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]; }); }
  function year() { return Number(data.settings.year) || new Date().getFullYear(); }
  function holidaySet() { var s = {}; data.holidays.forEach(function (h) { s[h.date] = 1; }); return s; }

  function workingDays(start, end, hs, half, clipYear) {
    if (!start || !end) return 0;
    var s = parse(start), e = parse(end);
    if (e < s) return 0;
    if (clipYear) {
      var ys = new Date(clipYear, 0, 1), ye = new Date(clipYear, 11, 31);
      if (s < ys) s = ys;
      if (e > ye) e = ye;
      if (e < s) return 0;
    }
    var count = 0;
    for (var d = new Date(s); d <= e; d.setDate(d.getDate() + 1)) {
      var wd = d.getDay();
      if (wd === 0 || wd === 6) continue;
      if (hs[toStr(d)]) continue;
      count++;
    }
    if (half && start === end && count > 0) count -= 0.5;
    return count;
  }

  function computed() {
    var hs = holidaySet(), y = year();
    var items = data.leaves.map(function (l) {
      return Object.assign({}, l, { days:workingDays(l.start, l.end, hs, l.half), yearDays:workingDays(l.start, l.end, hs, l.half, y) });
    });
    function sum(t, st) { return items.filter(function (l) { return l.type === t && l.status === st; }).reduce(function (a, l) { return a + l.yearDays; }, 0); }
    var available = Number(data.settings.entitlement || 0) + Number(data.settings.carry || 0);
    var used = sum("Annual Leave", "Approved"), pending = sum("Annual Leave", "Pending");
    var bhList = [];
    if (data.settings.includesBH) {
      data.holidays.forEach(function (h) {
        var d = parse(h.date), wd = d.getDay();
        if (d.getFullYear() === y && wd !== 0 && wd !== 6) bhList.push(h);
      });
      bhList.sort(function (a, b) { return a.date.localeCompare(b.date); });
    }
    var bh = bhList.length;
    var approvedDays = [], pendingDays = [];
    items.forEach(function (l) {
      if (l.type !== "Annual Leave" || (l.status !== "Approved" && l.status !== "Pending")) return;
      var s0 = parse(l.start), e0 = parse(l.end), ys = new Date(y, 0, 1), ye = new Date(y, 11, 31);
      if (s0 < ys) s0 = ys;
      if (e0 > ye) e0 = ye;
      var w = (l.half && l.start === l.end) ? 0.5 : 1;
      for (var d = new Date(s0); d <= e0; d.setDate(d.getDate() + 1)) {
        var wd = d.getDay();
        if (wd === 0 || wd === 6 || hs[toStr(d)]) continue;
        (l.status === "Approved" ? approvedDays : pendingDays).push({ date:toStr(d), w:w });
      }
    });
    var taken = Number(data.settings.taken || 0);
    var left = available - bh - taken - used;
    return { items:items, sum:sum, available:available, bh:bh, bhList:bhList, approvedDays:approvedDays, pendingDays:pendingDays, taken:taken, used:used, pending:pending, remaining:left, remainingIfAll:left - pending, hs:hs };
  }

  function chipStyle(s) {
    var m = { Approved:["#0B7A6D","#CCFBEF"], Pending:["#9A5B00","#FFEBC2"], Rejected:["#BE123C","#FFE1E6"] }[s];
    return "color:" + m[0] + ";background:" + m[1] + ";";
  }
  function opts(list, sel) { return list.map(function (o) { return "<option" + (o === sel ? " selected" : "") + ">" + o + "</option>"; }).join(""); }

  var ICON = {
    overview:'<svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg>',
    log:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>',
    settings:'<svg viewBox="0 0 24 24"><path d="M4 7h9M18 7h2M4 17h2M11 17h9"/><circle cx="15.5" cy="7" r="2.5"/><circle cx="8.5" cy="17" r="2.5"/></svg>'
  };

  // ---- views ----
  function shortName(n) {
    return String(n).replace(/ bank holiday/i, "").replace(/\s*\(.*\)/, "").replace("Christmas Day", "Christmas")
      .replace("New Year's Day", "New Year").replace("Easter Monday", "Easter Mon").replace("Good Friday", "Good Fri").trim();
  }
  function dm(s) { var d = parse(s); return d.getDate() + " " + mon(s); }

  function pipsHtml(c) {
    var total = Math.max(1, Math.ceil(c.available));
    var segs = [], at = 0;
    function push(cls, w, date, info, sub) { segs.push({ cls:cls, s:at, e:at + w, date:date, info:info, sub:sub }); at += w; }
    c.bhList.forEach(function (h) { push("bh", 1, h.date, fmt(h.date, true) + " · " + h.name, shortName(h.name)); });
    if (c.taken > 0) push("taken", c.taken, "", "", "");
    c.approvedDays.forEach(function (d) { push("taken", d.w, d.date, fmt(d.date, true) + " · Annual leave (approved)", "Leave"); });
    c.pendingDays.forEach(function (d) { push("pending", d.w, d.date, fmt(d.date, true) + " · Annual leave (pending)", "Pending"); });
    var out = "";
    for (var i = 0; i < total; i++) {
      var m = i + 0.5, seg = null;
      for (var k = 0; k < segs.length; k++) { if (m >= segs[k].s && m < segs[k].e) { seg = segs[k]; break; } }
      if (seg && seg.date) {
        out += '<button class="pip lbl ' + seg.cls + '" style="--i:' + i + '" data-act="bhinfo" data-info="' + esc(seg.info) + '"><b>' + dm(seg.date) + "</b><small>" + esc(seg.sub) + "</small></button>";
      } else {
        out += '<div class="pip ' + (seg ? seg.cls : "free") + '" style="--i:' + i + '"></div>';
      }
    }
    return out;
  }

  function wheelCard(c) {
    var A = c.available;
    var bhN = c.bh, tkN = c.taken + c.used, pdN = c.pending;
    var frBooked = Math.max(0, A - bhN - tkN - pdN);
    function pc(n) { return A > 0 ? Math.round(n / A * 100) : 0; }
    var pB = pc(bhN), pT = pc(tkN), pP = pc(pdN), pF = A > 0 ? Math.max(0, 100 - pB - pT - pP) : 0;
    var usedPct = pc(bhN + tkN);
    var R = 50, CIRC = 2 * Math.PI * R;
    var segs = [[bhN, "#C084FC"], [tkN, "#4338CA"], [pdN, "#FFB020"], [frBooked, "#2DD4BF"]];
    var off = 0, arcs = "";
    segs.forEach(function (sg) {
      var len = A > 0 ? Math.min(CIRC - off, Math.max(0, sg[0] / A * CIRC)) : 0;
      if (len > 0.5) {
        arcs += '<circle class="arc" cx="66" cy="66" r="' + R + '" stroke="' + sg[1] + '" stroke-dasharray="' + len + " " + CIRC + '" stroke-dashoffset="' + (-off) + '" style="--c:' + CIRC + '"/>';
      }
      off += len;
    });
    var rows = [["#C084FC", "Bank holidays", bhN, pB], ["#4338CA", "Taken", tkN, pT], ["#FFB020", "Pending", pdN, pP], ["#2DD4BF", "Not booked", frBooked, pF]].map(function (r) {
      return '<div class="wrow"><i style="background:' + r[0] + '"></i><span>' + r[1] + "</span><b>" + num(r[2]) + "d · " + r[3] + "%</b></div>";
    }).join("");
    return '<div class="card"><h2>Allowance used</h2><div class="wheelRow' + (animate ? " anim" : "") + '">' +
      '<svg width="132" height="132" viewBox="0 0 132 132" role="img" aria-label="' + usedPct + ' percent of your allowance used">' +
      '<circle cx="66" cy="66" r="' + R + '" fill="none" stroke="#EEEAFB" stroke-width="16"/>' +
      '<g transform="rotate(-90 66 66)" fill="none" stroke-width="16">' + arcs + "</g>" +
      '<text x="66" y="70" text-anchor="middle" font-size="28" font-weight="900" fill="#1E1B4B">' + usedPct + '%</text>' +
      '<text x="66" y="88" text-anchor="middle" font-size="11" font-weight="700" fill="#64648A">used</text></svg>' +
      '<div class="wlist">' + rows + "</div></div></div>";
  }

  function overview(c) {
    var y = year();
    var yStart = new Date(y, 0, 1).getTime(), span = new Date(y, 11, 31, 23, 59).getTime() - yStart;
    function pos(s) { return Math.min(100, Math.max(0, (parse(s).getTime() - yStart) / span * 100)); }
    var ticks = data.holidays.filter(function (h) { return h.date >= y + "-01-01" && h.date <= y + "-12-31"; }).map(function (h) {
      return '<div class="mk" style="left:' + pos(h.date) + '%;width:' + (100 / 365) + '%;min-width:3px;background:#C084FC"></div>';
    }).join("");
    var strip = c.items.filter(function (l) { return l.status !== "Rejected" && l.end >= y + "-01-01" && l.start <= y + "-12-31"; });
    var now = new Date(), todayPct = now.getFullYear() === y ? (now.getTime() - yStart) / span * 100 : null;
    var bars = strip.map(function (l) {
      var a = pos(l.start), b = Math.max(pos(l.end) + 100 / 365, a + 1);
      var color = l.type === "Annual Leave" ? (l.status === "Approved" ? "#4338CA" : "#FFB020") : "#F43F5E";
      return '<div class="lv" style="left:' + a + '%;width:' + (Math.min(b, 100) - a) + '%;background:' + color + '"></div>';
    }).join("");
    var months = ""; for (var i = 0; i < 12; i++) months += '<div class="m"></div>';
    var mlabels = MONTHS.map(function (m) { return "<div>" + m + "</div>"; }).join("");

    var upcoming = c.items.filter(function (l) { return l.status !== "Rejected" && l.end >= toStr(now); })
      .sort(function (a, b) { return a.start.localeCompare(b.start); })[0];

    var neg = c.remaining < 0;
    var warn = c.remainingIfAll < 0
      ? '<div class="card warn">You\'ve booked ' + num(Math.abs(c.remainingIfAll)) + " more day" + (Math.abs(c.remainingIfAll) === 1 ? "" : "s") + " than your allowance.</div>" : "";

    var nudge = "";
    if (c.remainingIfAll > 0 && y === now.getFullYear()) {
      var today0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      var daysToEnd = Math.max(0, Math.ceil((new Date(y, 11, 31) - today0) / 86400000));
      var monthsLeft = Math.max(1, Math.ceil(daysToEnd / 30.4));
      var perMonth = Math.ceil(c.remainingIfAll / monthsLeft * 2) / 2;
      var tone = daysToEnd <= 30 ? ["#FFE4E6", "#9F1239", "#E11D48"] : daysToEnd <= 90 ? ["#FFF3D6", "#8A5300", "#D97706"] : ["#E0F2FE", "#075985", "#0284C7"];
      nudge = '<div class="card nudge" style="background:' + tone[0] + ";color:" + tone[1] + '"><div class="nt"><b>' +
        (c.remainingIfAll === 1 ? "1 day still to book" : num(c.remainingIfAll) + " days still to book") + "</b><span>" +
        daysToEnd + " days left in " + y + ". Aim for about " + num(perMonth) + (perMonth === 1 ? " day" : " days") + " a month.</span></div>" +
        '<button data-tab="log" style="background:' + tone[2] + '">Book</button></div>';
    }

    var blocks = c.items.filter(function (l) {
      return l.type === "Annual Leave" && (l.status === "Approved" || l.status === "Pending") && l.yearDays > 0;
    }).map(function (l) {
      var col = l.status === "Approved" ? "var(--indigo)" : "var(--amber)";
      return '<div class="blk"><i style="background:' + col + '"></i><span><b>' + l.status + "</b> " + dm(l.start) + (l.end !== l.start ? " – " + dm(l.end) : "") + " · " + num(l.yearDays) + (l.yearDays === 1 ? " day" : " days") + "</span></div>";
    }).join("");

    var legend = (data.settings.includesBH ? '<span class="lg"><i style="background:var(--lav)"></i>Bank holidays ' + num(c.bh) + "</span>" : "") +
      '<span class="lg"><i style="background:var(--indigo)"></i>Taken ' + num(c.taken + c.used) + "</span>" +
      '<span class="lg"><i style="background:var(--amber)"></i>Pending ' + num(c.pending) + "</span>" +
      '<span class="lg"><i style="background:var(--mint)"></i>Left ' + num(c.remaining) + "</span>";

    var nextHtml = upcoming
      ? '<div class="nrow"><div class="dbadge" style="background:' + TYPE_COL[upcoming.type][0] + ";color:" + TYPE_COL[upcoming.type][1] + '"><b>' + parse(upcoming.start).getDate() + "</b><span>" + mon(upcoming.start) + "</span></div>" +
        '<div><div style="font-weight:800;font-size:15px">' + esc(upcoming.type) + '</div><div class="sub" style="margin:2px 0 6px">' + fmt(upcoming.start) + (upcoming.end !== upcoming.start ? " to " + fmt(upcoming.end) : "") + " · " + num(upcoming.days) + " day" + (upcoming.days === 1 ? "" : "s") + "</div>" +
        '<span class="chip" style="' + chipStyle(upcoming.status) + '">' + upcoming.status + "</span></div></div>"
      : '<div class="empty">Nothing booked yet. Tap “Log leave” to add your next break.</div>';

    var other = [["Sick","#FFE4E6","#BE123C"],["Unpaid","#E2E8F0","#475569"],["Other","#FEF3C7","#B45309"]].map(function (t) {
      return '<div class="tile" style="background:' + t[1] + ";color:" + t[2] + '"><b>' + num(c.sum(t[0], "Approved")) + "</b><span>" + t[0] + "</span></div>";
    }).join("");

    return '<div class="card hero"><div class="heroTop"><div><div class="big' + (neg ? " neg" : "") + '">' + num(c.remaining) + '</div><div class="bigLbl">days left this year</div></div>' +
      '<div class="ifAll">if pending approved<b style="color:' + (c.remainingIfAll < 0 ? "#F43F5E" : "#1E1B4B") + '">' + num(c.remainingIfAll) + "</b></div></div>" +
      '<div class="pips' + (animate ? " anim" : "") + '" role="img" aria-label="' + num(c.available) + ' days: ' + num(c.remaining) + ' left">' + pipsHtml(c) + "</div>" +
      '<div class="legend">' + legend + "</div>" + (blocks ? '<div class="blks">' + blocks + "</div>" : "") + "</div>" + warn + nudge + wheelCard(c) +
      '<div class="card"><h2>Your year</h2><div class="strip">' + months + ticks + bars +
      (todayPct !== null ? '<div class="today" style="left:' + todayPct + '%"></div>' : "") + "</div>" +
      '<div class="mlab">' + mlabels + "</div>" +
      '<div class="legend" style="margin-top:10px"><span class="lg"><i style="background:#4338CA"></i>Approved</span><span class="lg"><i style="background:#FFB020"></i>Pending</span><span class="lg"><i style="background:#F43F5E"></i>Sick / other</span><span class="lg"><i style="background:#C084FC"></i>Bank holiday</span></div></div>' +
      '<div class="card next"><h2>Next up</h2>' + nextHtml + "</div>" +
      '<div class="card"><h2>Other time off (approved)</h2><div class="tiles">' + other + "</div></div>";
  }

  function logView(c) {
    var list = c.items.length === 0 ? '<div class="empty">No leave logged yet. Add your first break above.</div>' : c.items.map(function (l) {
      var tc = TYPE_COL[l.type] || TYPE_COL.Other;
      return '<div class="leave"><div class="dbadge" style="background:' + tc[0] + ";color:" + tc[1] + '"><b>' + parse(l.start).getDate() + "</b><span>" + mon(l.start) + "</span></div>" +
        '<div class="lbody"><div class="ltitle"><span>' + fmt(l.start) + (l.end !== l.start ? " – " + fmt(l.end) : "") + "</span><span>" + num(l.days) + "d</span></div>" +
        '<div class="sub" style="margin-top:2px">' + esc(l.type) + (l.half ? " · half day" : "") + (l.notes ? " · " + esc(l.notes) : "") + "</div>" +
        '<div class="lact"><select class="statusSel" aria-label="Status" data-status="' + l.id + '" style="' + chipStyle(l.status) + '">' + opts(STATUSES, l.status) + "</select>" +
        '<button class="btn ghost" data-act="del" data-id="' + l.id + '">Delete</button></div></div></div>';
    }).join("");

    return '<div class="card"><h2>Add leave</h2>' +
      '<div class="row"><div><label for="f-start">First day</label><input id="f-start" type="date" data-form="start" value="' + form.start + '"></div>' +
      '<div><label for="f-end">Last day</label><input id="f-end" type="date" data-form="end" value="' + form.end + '"></div></div>' +
      '<div class="row"><div><label for="f-type">Type</label><select id="f-type" data-form="type">' + opts(TYPES, form.type) + "</select></div>" +
      '<div><label for="f-status">Status</label><select id="f-status" data-form="status">' + opts(STATUSES, form.status) + "</select></div></div>" +
      '<div style="margin-bottom:12px"><label for="f-notes">Notes (optional)</label><input id="f-notes" type="text" data-form="notes" value="' + esc(form.notes) + '"></div>' +
      '<label class="check"><input type="checkbox" data-form="half"' + (form.half ? " checked" : "") + "> Half day (single day only)</label>" +
      '<div class="preview" id="preview"></div>' +
      '<div class="err" id="err" role="alert">' + esc(error) + "</div>" +
      '<button class="btn" data-act="add">Add leave</button></div>' +
      '<div class="card"><h2>All leave</h2>' + list + "</div>";
  }

  function settingsView() {
    var s = data.settings;
    var hols = data.holidays.length === 0 ? '<div class="empty">No holidays added.</div>' : data.holidays.map(function (h) {
      return '<div class="stat"><span>' + fmt(h.date, true) + " · " + esc(h.name) + '</span><button class="btn ghost" data-act="delhol" data-date="' + h.date + '">Remove</button></div>';
    }).join("");
    return '<div class="card"><h2>Your leave year</h2>' +
      '<div style="margin-bottom:12px"><label for="s-name">Name</label><input id="s-name" type="text" data-set="name" value="' + esc(s.name) + '"></div>' +
      '<div class="row"><div><label for="s-year">Leave year</label><input id="s-year" type="number" inputmode="numeric" data-set="year" value="' + esc(s.year) + '"></div>' +
      '<div><label for="s-ent">Entitlement (days)</label><input id="s-ent" type="number" inputmode="decimal" step="0.5" data-set="entitlement" value="' + esc(s.entitlement) + '"></div></div>' +
      '<div style="margin-bottom:12px"><label for="s-tk">Leave already taken this year (days)</label><input id="s-tk" type="number" inputmode="decimal" step="0.5" data-set="taken" value="' + esc(s.taken) + '"><div class="sub">Days off before you started using this tracker, not counting bank holidays.</div></div>' +
      '<div class="row"><div><label for="s-car">Carried over (days)</label><input id="s-car" type="number" inputmode="decimal" step="0.5" data-set="carry" value="' + esc(s.carry) + '"></div>' +
      '<div><label for="s-hrs">Hours per day</label><input id="s-hrs" type="number" inputmode="decimal" step="0.5" data-set="hours" value="' + esc(s.hours) + '"></div></div>' +
      '<label class="check"><input type="checkbox" data-set="includesBH"' + (s.includesBH ? " checked" : "") + '> My entitlement includes bank holidays</label>' +
      '<div class="sub">When this is on, each weekday bank holiday in the year comes off your allowance automatically, so you only log the extra days you book.</div></div>' +
      '<div class="card"><h2>Bank holidays</h2><div class="sub" style="margin-bottom:12px">England &amp; Wales holidays for 2026–27 are pre-loaded. Check them against your region (Scotland and Northern Ireland differ).</div>' +
      '<div class="row"><div><label for="h-date">Date</label><input id="h-date" type="date" value="' + hol.date + '"></div>' +
      '<div><label for="h-name">Name</label><input id="h-name" type="text" value="' + esc(hol.name) + '"></div></div>' +
      '<button class="btn" data-act="addhol">Add holiday</button><button class="btn soft" data-act="addew">Re-add England &amp; Wales 2026–27</button><div style="margin-top:10px">' + hols + "</div></div>" +
      '<div class="card"><h2>Your data</h2><div class="sub" style="margin-bottom:12px">Everything is stored in this browser on this device. Clearing browser data will erase it.</div>' +
      '<button class="btn danger" data-act="reset">Clear all data</button></div>';
  }

  function render() {
    var c = computed();
    var s = data.settings;
    var nav = [["overview","Overview"],["log","Log leave"],["settings","Settings"]].map(function (t) {
      return '<button class="tab" role="tab" data-tab="' + t[0] + '" aria-selected="' + (tab === t[0]) + '">' + ICON[t[0]] + "<span>" + t[1] + "</span></button>";
    }).join("");
    document.getElementById("app").innerHTML =
      '<div class="top"><h1>' + (s.name ? esc(s.name) + "'s leave" : "Annual leave") + " " + year() + "</h1>" +
      "<p>" + (s.includesBH ? "Your allowance includes bank holidays." : "Weekends and bank holidays aren't counted.") + "</p></div>" +
      '<div class="body">' + (tab === "overview" ? overview(c) : tab === "log" ? logView(c) : settingsView()) + "</div>" +
      '<div class="nav"><div class="navIn" role="tablist">' + nav + "</div></div>";
    if (tab === "overview") animate = false;
    if (tab === "log") updatePreview();
  }

  function updatePreview() {
    var p = document.getElementById("preview");
    if (!p) return;
    if (form.start && (form.end || form.start) >= form.start) {
      p.textContent = "This will use " + num(workingDays(form.start, form.end || form.start, holidaySet(), form.half)) + " working day(s).";
    } else p.textContent = "";
  }

  function toast(msg, ms) {
    var t = document.createElement("div");
    t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, ms || 1800);
  }

  // ---- events ----
  var app = document.getElementById("app");

  app.addEventListener("click", function (e) {
    var t = e.target.closest("[data-tab],[data-act]");
    if (!t) return;
    if (t.dataset.tab) { tab = t.dataset.tab; render(); window.scrollTo(0, 0); return; }
    var act = t.dataset.act;
    if (act === "bhinfo") { toast(t.dataset.info, 3200); return; }
    if (act === "add") {
      if (!form.start) { error = "Choose a start date."; return render(); }
      var end = form.end || form.start;
      if (end < form.start) { error = "The end date is before the start date."; return render(); }
      if (workingDays(form.start, end, holidaySet(), form.half) === 0) { error = "That range has no working days (weekends and bank holidays are skipped)."; return render(); }
      data.leaves.push({ id:Date.now() + Math.random(), start:form.start, end:end, type:form.type, half:form.half, status:form.status, notes:form.notes });
      data.leaves.sort(function (a, b) { return a.start.localeCompare(b.start); });
      form = { start:"", end:"", type:"Annual Leave", half:false, status:"Pending", notes:"" };
      error = ""; save(); render(); toast("Leave added");
    } else if (act === "del") {
      data.leaves = data.leaves.filter(function (l) { return String(l.id) !== t.dataset.id; });
      save(); render();
    } else if (act === "addhol") {
      var d = document.getElementById("h-date").value, n = document.getElementById("h-name").value;
      if (!d || data.holidays.some(function (h) { return h.date === d; })) return;
      data.holidays.push({ date:d, name:n || "Bank holiday" });
      data.holidays.sort(function (a, b) { return a.date.localeCompare(b.date); });
      hol = { date:"", name:"" }; save(); render();
    } else if (act === "addew") {
      ewList().forEach(function (h) { if (!data.holidays.some(function (x) { return x.date === h.date; })) data.holidays.push(h); });
      data.holidays.sort(function (a, b) { return a.date.localeCompare(b.date); });
      save(); render(); toast("Holidays added");
    } else if (act === "delhol") {
      data.holidays = data.holidays.filter(function (h) { return h.date !== t.dataset.date; });
      save(); render();
    } else if (act === "reset") {
      if (window.confirm("Delete all leave, holidays and settings?")) { data = defaults(); save(); render(); }
    }
  });

  function onFormInput(e) {
    var el = e.target, k = el.dataset.form;
    if (!k) return;
    form[k] = el.type === "checkbox" ? el.checked : el.value;
    if (k === "start") {
      if (!form.end || form.end < form.start) { form.end = form.start; document.getElementById("f-end").value = form.end; }
    }
    if (error) { error = ""; var er = document.getElementById("err"); if (er) er.textContent = ""; }
    updatePreview();
  }
  app.addEventListener("input", onFormInput);
  app.addEventListener("change", function (e) {
    var el = e.target;
    if (el.dataset.form) return onFormInput(e);
    if (el.dataset.set) {
      var k = el.dataset.set;
      data.settings[k] = el.type === "checkbox" ? el.checked : el.type === "number" ? (el.value === "" ? 0 : Number(el.value)) : el.value;
      save(); render();
    } else if (el.dataset.status) {
      data.leaves.forEach(function (l) { if (String(l.id) === el.dataset.status) l.status = el.value; });
      save(); render();
    } else if (el.id === "h-date") hol.date = el.value;
    else if (el.id === "h-name") hol.name = el.value;
  });

  render();
})();
</script>
</body>
</html>
