<title>Annual Leave</title>
<style>

  .btn { border:0; background:linear-gradient(135deg,#4338CA,#7C3AED); color:#fff; font:inherit; font-weight:650; padding:14px 16px; border-radius:16px; width:100%; cursor:pointer; font-size:16px; letter-spacing:-.01em; box-shadow:inset 0 1px 0 rgba(255,255,255,.24), 0 10px 20px -8px rgba(124,58,237,.55); transition:transform .12s; }

<div id="app"></div>
<script>
(function () {
  "use strict";
  var KEY = "annual-leave-tracker-v1";
  var TYPES = ["Annual Leave", "Sick", "Unpaid", "Other"];
  var STATUSES = ["Pending", "Approved", "Rejected"];
  var MONTHS = ["J","F","M","A","M","J","J","A","S","O","N","D"];
  var TYPE_COL = {

      var a = pos(l.start), b = Math.max(pos(l.end) + 100 / 365, a + 1);
      var color = l.type === "Annual Leave" ? (l.status === "Approved" ? "var(--indigo)" : "#FFB020") : "#F43F5E";
      return '<div class="lv" style="left:' + a + '%;width:' + (Math.min(b, 100) - a) + '%;background:' + color + '"></div>';
    }).join("");
    var months = ""; for (var i = 0; i < 12; i++) months += '<div class="m"></div>';
    var mlabels = MONTHS.map(function (m) { return "<div>" + m + "</div>"; }).join("");

    var upcoming = c.items.filter(function (l) { return l.status !== "Rejected" && l.end >= toStr(now); })
      .sort(function (a, b) { return a.start.localeCompare(b.start); })[0];

    var neg = c.remaining < 0;
    var warn = c.remainingIfAll < 0
      ? '<div class="card warn">You\'ve booked ' + num(Math.abs(c.remainingIfAll)) + " more day" + (Math.abs(c.remainingIfAll) === 1 ? "" : "s") + " than your allowance.</div>" : "";

    var nudge = "";
    if (c.remainingIfAll > 0 && y === now.getFullYear()) {
      var today0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      var daysToEnd = Math.max(0, Math.ceil((new Date(y, 11, 31) - today0) / 86400000));
      var monthsLeft = Math.max(1, Math.ceil(daysToEnd / 30.4));
      var perMonth = Math.ceil(c.remainingIfAll / monthsLeft * 2) / 2;
      var tk = daysToEnd <= 30 ? "n3" : daysToEnd <= 90 ? "n2" : "n1";
      var tone = ["var(--" + tk + "-bg)", "var(--" + tk + "-fg)", "var(--" + tk + "-btn)"];
      nudge = '<div class="card nudge" style="background:' + tone[0] + ";color:" + tone[1] + '"><div class="nt"><b>' +
        (c.remainingIfAll === 1 ? "1 day still to book" : num(c.remainingIfAll) + " days still to book") + "</b><span>" +
        daysToEnd + " days left in " + y + ". Aim for about " + num(perMonth) + (perMonth === 1 ? " day" : " days") + " a month.</span></div>" +
        '<button data-tab="log" style="background:' + tone[2] + '">Book</button></div>';
    }

    var blocks = c.items.filter(function (l) {
      return l.type === "Annual Leave" && (l.status === "Approved" || l.status === "Pending") && l.yearDays > 0;
    }).map(function (l) {
      var col = l.status === "Approved" ? "var(--indigo)" : "var(--amber)";
      return '<div class="blk"><i style="background:' + col + '"></i><span><b>' + l.status + "</b> " + dm(l.start) + (l.end !== l.start ? " – " + dm(l.end) : "") + " · " + num(l.yearDays) + (l.yearDays === 1 ? " day" : " days") + "</span></div>";
    }).join("");

    var legend = (data.settings.includesBH ? '<span class="lg"><i style="background:var(--lav)"></i>Bank holidays ' + num(c.bh) + "</span>" : "") +
      '<span class="lg"><i style="background:var(--indigo)"></i>Taken ' + num(c.taken + c.used) + "</span>" +
      '<span class="lg"><i style="background:var(--amber)"></i>Pending ' + num(c.pending) + "</span>" +
      '<span class="lg"><i style="background:var(--mint)"></i>Left ' + num(c.remaining) + "</span>";

    var cd = "", cdTop = "";
    if (upcoming) {
      var t0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      var toStart = Math.round((parse(upcoming.start) - t0) / 86400000);
      var toEnd = Math.round((parse(upcoming.end) - t0) / 86400000);
      if (toStart > 0) {
        cd = '<div class="cd"><b data-count="' + toStart + '">' + toStart + "</b><span>day" + (toStart === 1 ? "" : "s") + " to go</span></div>";
        cdTop = toStart + " day" + (toStart === 1 ? "" : "s") + " until your next break · " + dm(upcoming.start);
      } else {
        cd = '<div class="cd"><b data-count="' + (toEnd + 1) + '">' + (toEnd + 1) + "</b><span>day" + (toEnd === 0 ? "" : "s") + " left</span></div>";
        cdTop = "You're on leave now, until " + dm(upcoming.end);
      }
    }
    topNote = cdTop;

    var nextHtml = upcoming
      ? '<div class="nrow"><div class="dbadge" style="background:' + TYPE_COL[upcoming.type][0] + ";color:" + TYPE_COL[upcoming.type][1] + '"><b>' + parse(upcoming.start).getDate() + "</b><span>" + mon(upcoming.start) + "</span></div>" +
        '<div><div style="font-weight:650;font-size:15px">' + esc(upcoming.type) + '</div><div class="sub" style="margin:2px 0 6px">' + fmt(upcoming.start) + (upcoming.end !== upcoming.start ? " to " + fmt(upcoming.end) : "") + " · " + num(upcoming.days) + " day" + (upcoming.days === 1 ? "" : "s") + "</div>" +
        '<span class="chip" style="' + chipStyle(upcoming.status) + '">' + upcoming.status + "</span></div>" + cd + "</div>"
      : '<div class="empty">Nothing booked yet. Tap “Log leave” to add your next break.</div>';

    var other = [["Sick","var(--ts-bg)","var(--ts-fg)"],["Unpaid","var(--tu-bg)","var(--tu-fg)"],["Other","var(--to-bg)","var(--to-fg)"]].map(function (t) {
      return '<div class="tile" style="background:' + t[1] + ";color:" + t[2] + '"><b>' + num(c.sum(t[0], "Approved")) + "</b><span>" + t[0] + "</span></div>";
    }).join("");

    return '<div class="card hero">' +
      '<div class="pips' + (animate ? " anim" : "") + '" role="img" aria-label="' + num(c.available) + ' days: ' + num(c.remaining) + ' left">' + pipsHtml(c) + "</div>" +
      '<div class="legend">' + legend + "</div>" + (blocks ? '<div class="blks">' + blocks + "</div>" : "") + "</div>" + warn + nudge + tipsCard(c) + wheelCard(c) +
      '<div class="card"><h2>Your year</h2><div class="strip">' + months + ticks + bars +
      (todayPct !== null ? '<div class="today" style="left:' + todayPct + '%"></div>' : "") + "</div>" +
      '<div class="mlab">' + mlabels + "</div>" +
      '<div class="legend" style="margin-top:10px"><span class="lg"><i style="background:var(--indigo)"></i>Approved</span><span class="lg"><i style="background:#FFB020"></i>Pending</span><span class="lg"><i style="background:#F43F5E"></i>Sick / other</span><span class="lg"><i style="background:#C084FC"></i>Bank holiday</span></div></div>' +
      '<div class="card next"><h2>Next up</h2>' + nextHtml + "</div>" +
      '<div class="card"><h2>Other time off (approved)</h2><div class="tiles">' + other + "</div></div>";
  }

  function logView(c) {
    var list = c.items.length === 0 ? '<div class="empty">No leave logged yet. Add your first break above.</div>' : c.items.map(function (l) {
      var tc = TYPE_COL[l.type] || TYPE_COL.Other;
      return '<div class="leave"><div class="dbadge" style="background:' + tc[0] + ";color:" + tc[1] + '"><b>' + parse(l.start).getDate() + "</b><span>" + mon(l.start) + "</span></div>" +
        '<div class="lbody"><div class="ltitle"><span>' + fmt(l.start) + (l.end !== l.start ? " – " + fmt(l.end) : "") + "</span><span>" + num(l.days) + "d</span></div>" +
        '<div class="sub" style="margin-top:2px">' + esc(l.type) + (l.half ? " · half day" : "") + (l.notes ? " · " + esc(l.notes) : "") + "</div>" +
        '<div class="lact"><select class="statusSel" aria-label="Status" data-status="' + l.id + '" style="' + chipStyle(l.status) + '">' + opts(STATUSES, l.status) + "</select>" +
        '<button class="btn ghost" data-act="del" data-id="' + l.id + '">Delete</button></div></div></div>';
    }).join("");

    return '<div class="card"><h2>Add leave</h2>' +
      '<div class="row"><div><label for="f-start">First day</label><input id="f-start" type="date" data-form="start" value="' + form.start + '"></div>' +
      '<div><label for="f-end">Last day</label><input id="f-end" type="date" data-form="end" value="' + form.end + '"></div></div>' +
      '<div class="row"><div><label for="f-type">Type</label><select id="f-type" data-form="type">' + opts(TYPES, form.type) + "</select></div>" +
      '<div><label for="f-status">Status</label><select id="f-status" data-form="status">' + opts(STATUSES, form.status) + "</select></div></div>" +
      '<div style="margin-bottom:12px"><label for="f-notes">Notes (optional)</label><input id="f-notes" type="text" data-form="notes" value="' + esc(form.notes) + '"></div>' +
      '<label class="check"><input type="checkbox" data-form="half"' + (form.half ? " checked" : "") + "> Half day (single day only)</label>" +
      '<div class="preview" id="preview"></div>' +
      '<div class="err" id="err" role="alert">' + esc(error) + "</div>" +
      '<button class="btn" data-act="add">Add leave</button></div>' +
      '<div class="card"><h2>All leave</h2>' + list + "</div>";
  }

  function settingsView() {
    var s = data.settings;
    var hols = data.holidays.length === 0 ? '<div class="empty">No holidays added.</div>' : data.holidays.map(function (h) {
      return '<div class="stat"><span>' + fmt(h.date, true) + " · " + esc(h.name) + '</span><button class="btn ghost" data-act="delhol" data-date="' + h.date + '">Remove</button></div>';
    }).join("");
    return '<div class="card"><h2>Your leave year</h2>' +
      '<div style="margin-bottom:12px"><label for="s-name">Name</label><input id="s-name" type="text" data-set="name" value="' + esc(s.name) + '"></div>' +
      '<div class="row"><div><label for="s-year">Leave year</label><input id="s-year" type="number" inputmode="numeric" data-set="year" value="' + esc(s.year) + '"></div>' +
      '<div><label for="s-ent">Entitlement (days)</label><input id="s-ent" type="number" inputmode="decimal" step="0.5" data-set="entitlement" value="' + esc(s.entitlement) + '"></div></div>' +
      '<div style="margin-bottom:12px"><label for="s-tk">Leave already taken this year (days)</label><input id="s-tk" type="number" inputmode="decimal" step="0.5" data-set="taken" value="' + esc(s.taken) + '"><div class="sub">Days off before you started using this tracker, not counting bank holidays.</div></div>' +
      '<div class="row"><div><label for="s-car">Carried over (days)</label><input id="s-car" type="number" inputmode="decimal" step="0.5" data-set="carry" value="' + esc(s.carry) + '"></div>' +
      '<div><label for="s-hrs">Hours per day</label><input id="s-hrs" type="number" inputmode="decimal" step="0.5" data-set="hours" value="' + esc(s.hours) + '"></div></div>' +
      '<label class="check"><input type="checkbox" data-set="includesBH"' + (s.includesBH ? " checked" : "") + '> My entitlement includes bank holidays</label>' +
      '<div class="sub">When this is on, each weekday bank holiday in the year comes off your allowance automatically, so you only log the extra days you book.</div></div>' +
      '<div class="card"><h2>Bank holidays</h2><div class="sub" style="margin-bottom:12px">England &amp; Wales holidays for 2026–27 are pre-loaded. Check them against your region (Scotland and Northern Ireland differ).</div>' +
      '<div class="row"><div><label for="h-date">Date</label><input id="h-date" type="date" value="' + hol.date + '"></div>' +
      '<div><label for="h-name">Name</label><input id="h-name" type="text" value="' + esc(hol.name) + '"></div></div>' +
      '<button class="btn" data-act="addhol">Add holiday</button><button class="btn soft" data-act="addew">Re-add England &amp; Wales 2026–27</button><div style="margin-top:10px">' + hols + "</div></div>" +
      '<div class="card"><h2>Backup and move your data</h2><div class="sub" style="margin:-6px 0 12px">Your leave is stored on this device only. To move it to another phone or your computer, copy a backup code here, send it to yourself, then paste it on the other device.</div>' +
      '<div class="twin"><button class="btn" data-act="copycode">Copy backup code</button><button class="btn soft" style="margin-top:0" data-act="savefile">Save backup file</button></div>' +
      '<textarea class="code" id="code-in" placeholder="Paste a backup code here" aria-label="Backup code" spellcheck="false"></textarea>' +
      '<div class="twin" style="margin-top:10px"><button class="btn" data-act="restorecode">Restore from code</button><label class="btn soft filebtn" style="margin:0;color:var(--accent)">Restore from file<input type="file" id="imp" accept=".json,application/json" hidden></label></div></div>' +
      '<div class="card"><h2>Your data</h2><div class="sub" style="margin-bottom:12px">Everything is stored in this browser on this device. Clearing browser data will erase it.</div>' +
      '<button class="btn danger" data-act="reset">Clear all data</button></div>';
  }

  function render() {
    var c = computed();
    var s = data.settings;
    var big = tab === "overview";
    var nav = [["overview","Overview"],["calendar","Calendar"],["log","Log leave"],["settings","Settings"]].map(function (t) {
      return '<button class="tab" role="tab" data-tab="' + t[0] + '" aria-selected="' + (tab === t[0]) + '">' + ICON[t[0]] + "<span>" + t[1] + "</span></button>";
    }).join("");
    var stage = "";
    if (big) {
      var neg = c.remaining < 0;
      stage = '<div class="stage"><div class="heronum' + (neg ? " neg" : "") + '" data-count="' + num(c.remaining) + '" aria-label="' + num(c.remaining) + ' days left">' + num(c.remaining) + '</div>' +
        '<div class="herolbl"><b>days left</b><span>this year</span></div>' +
        '<div class="ifall">if pending<br>approved<b>' + num(c.remainingIfAll) + "</b></div></div>";
    }
    document.getElementById("app").innerHTML =
      '<div class="top' + (big ? " big" : "") + '"><h1>' + (s.name ? esc(s.name) + "'s leave" : "Annual leave") + " " + year() + "</h1>" + stage +
      "<p id=\"topnote\"></p></div>" +
      '<div class="body' + (enterAnim ? " enter" : "") + '">' + (tab === "overview" ? overview(c) : tab === "calendar" ? calView(c) : tab === "log" ? logView(c) : settingsView()) + "</div>" +
      '<div class="nav"><div class="navIn" role="tablist">' + nav + "</div></div>";
    enterAnim = false;
    var tn = document.getElementById("topnote");
    if (tn) tn.textContent = (tab === "overview" && topNote) ? topNote : (s.includesBH ? "Your allowance includes bank holidays." : "Weekends and bank holidays aren't counted.");
    if (tab === "overview" && animate) runCountUps();
    if (tab === "overview") animate = false;
    if (tab === "log") updatePreview();
  }

  // Count-up numbers: part of the single opening sequence (numbers, day squares and wheel arrive together).
  function runCountUps() {
    if (REDUCED) return;
    var els = document.querySelectorAll("[data-count]");
    Array.prototype.forEach.call(els, function (el) {
      var to = parseFloat(el.getAttribute("data-count")), suffix = el.getAttribute("data-suffix") || "";
      if (!isFinite(to) || to === 0) return;
      var dec = String(to).indexOf(".") > -1, t0 = null;
      el.textContent = "0" + suffix;
      function step(ts) {
        if (t0 === null) t0 = ts;
        var p = Math.min(1, (ts - t0) / 950), e = 1 - Math.pow(1 - p, 3), v = to * e;
        el.textContent = (p < 1 ? (dec ? v.toFixed(1) : Math.round(v)) : num(to)) + suffix;
        if (p < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    });
  }

  // A short confetti burst when a holiday is booked.
  function confetti() {
    if (REDUCED || !document.body.animate) return;
    var colors = ["#2DD4BF", "#FFB020", "#C084FC", "#EC4899", "#7C7CF8", "#FFFFFF"];
    var W = window.innerWidth, H = window.innerHeight;
    var box = document.createElement("div");
    box.setAttribute("aria-hidden", "true");
    box.style.cssText = "position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:40;overflow:hidden";
    document.body.appendChild(box);
    for (var i = 0; i < 46; i++) {
      var p = document.createElement("i"), sz = 6 + Math.random() * 7;
      p.style.cssText = "position:absolute;left:" + (W / 2) + "px;top:" + (H * 0.6) + "px;width:" + sz + "px;height:" + (sz * (Math.random() > 0.5 ? 1 : 0.5)) + "px;border-radius:2px;background:" + colors[i % colors.length];
      box.appendChild(p);
      var ang = (-90 + (Math.random() - 0.5) * 120) * Math.PI / 180, v = 240 + Math.random() * 330;
      var dx = Math.cos(ang) * v * 0.85, dy = Math.sin(ang) * v;
      p.animate([
        { transform:"translate(0,0) rotate(0deg)", opacity:1 },
        { transform:"translate(" + dx + "px," + dy + "px) rotate(" + (Math.random() * 540) + "deg)", opacity:1, offset:0.42 },
        { transform:"translate(" + (dx * 1.3) + "px," + (dy + H * 0.75) + "px) rotate(" + (Math.random() * 900) + "deg)", opacity:0 }
      ], { duration:1500 + Math.random() * 600, easing:"cubic-bezier(.2,.6,.4,1)", fill:"forwards" });
    }
    setTimeout(function () { if (box.parentNode) box.parentNode.removeChild(box); }, 2300);
  }

  function updatePreview() {
    var p = document.getElementById("preview");
    if (!p) return;
    if (form.start && (form.end || form.start) >= form.start) {
      p.textContent = "This will use " + num(workingDays(form.start, form.end || form.start, holidaySet(), form.half)) + " working day(s).";
    } else p.textContent = "";
  }

  function toast(msg, ms) {
    Array.prototype.forEach.call(document.querySelectorAll(".toast"), function (o) { if (o.parentNode) o.parentNode.removeChild(o); });
    var t = document.createElement("div");
    t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, ms || 1800);
  }

  // ---- events ----
  var app = document.getElementById("app");

  app.addEventListener("click", function (e) {
    var t = e.target.closest("[data-tab],[data-act]");
    if (!t) return;
    if (t.dataset.tab) { if (tab !== t.dataset.tab) enterAnim = true; tab = t.dataset.tab; render(); window.scrollTo(0, 0); return; }
    var act = t.dataset.act;
    if (act === "bhinfo") { toast(t.dataset.info, 3200); return; }
    if (act === "calprev" || act === "calnext") {
      var step = act === "calprev" ? -1 : 1, nd = new Date(cal.y, cal.m + step, 1);
      cal.y = nd.getFullYear(); cal.m = nd.getMonth(); render(); return;
    }
    if (act === "caltoday") { cal = { y:null, m:null }; render(); return; }
    if (act === "tip") {
      form.start = t.dataset.start; form.end = t.dataset.end; form.type = "Annual Leave"; form.half = false; form.status = "Pending"; error = "";
      tab = "log"; enterAnim = true; render(); window.scrollTo(0, 0); return;
    }
    if (act === "copycode") { copyCode(); return; }
    if (act === "savefile") { saveFile(); return; }
    if (act === "restorecode") { var ci = document.getElementById("code-in"); restoreFrom(ci ? ci.value : ""); return; }
    if (act === "add") {
      if (!form.start) { error = "Choose a start date."; return render(); }
      var end = form.end || form.start;
      if (end < form.start) { error = "The end date is before the start date."; return render(); }
      if (workingDays(form.start, end, holidaySet(), form.half) === 0) { error = "That range has no working days (weekends and bank holidays are skipped)."; return render(); }
      var celebrate = form.type === "Annual Leave";
      data.leaves.push({ id:Date.now() + Math.random(), start:form.start, end:end, type:form.type, half:form.half, status:form.status, notes:form.notes });
      data.leaves.sort(function (a, b) { return a.start.localeCompare(b.start); });
      form = { start:"", end:"", type:"Annual Leave", half:false, status:"Pending", notes:"" };
      error = ""; save(); render(); toast("Leave added"); if (celebrate) confetti();
    } else if (act === "del") {
      data.leaves = data.leaves.filter(function (l) { return String(l.id) !== t.dataset.id; });
      save(); render();
    } else if (act === "addhol") {
      var d = document.getElementById("h-date").value, n = document.getElementById("h-name").value;
      if (!d || data.holidays.some(function (h) { return h.date === d; })) return;
      data.holidays.push({ date:d, name:n || "Bank holiday" });
      data.holidays.sort(function (a, b) { return a.date.localeCompare(b.date); });
      hol = { date:"", name:"" }; save(); render();
    } else if (act === "addew") {
      ewList().forEach(function (h) { if (!data.holidays.some(function (x) { return x.date === h.date; })) data.holidays.push(h); });
      data.holidays.sort(function (a, b) { return a.date.localeCompare(b.date); });
      save(); render(); toast("Holidays added");
    } else if (act === "delhol") {
      data.holidays = data.holidays.filter(function (h) { return h.date !== t.dataset.date; });
      save(); render();
    } else if (act === "reset") {
      if (window.confirm("Delete all leave, holidays and settings?")) { data = defaults(); save(); render(); }
    }
  });

  function onFormInput(e) {
    var el = e.target, k = el.dataset.form;
    if (!k) return;
    form[k] = el.type === "checkbox" ? el.checked : el.value;
    if (k === "start") {
      if (!form.end || form.end < form.start) { form.end = form.start; document.getElementById("f-end").value = form.end; }
    }
    if (error) { error = ""; var er = document.getElementById("err"); if (er) er.textContent = ""; }
    updatePreview();
  }
  app.addEventListener("input", onFormInput);
  app.addEventListener("change", function (e) {
    var el = e.target;
    if (el.dataset.form) return onFormInput(e);
    if (el.dataset.set) {
      var k = el.dataset.set;
      data.settings[k] = el.type === "checkbox" ? el.checked : el.type === "number" ? (el.value === "" ? 0 : Number(el.value)) : el.value;
      save(); render();
    } else if (el.dataset.status) {
      data.leaves.forEach(function (l) { if (String(l.id) === el.dataset.status) l.status = el.value; });
      save(); render();
    } else if (el.id === "imp") {
      var f = el.files && el.files[0];
      if (f) { var fr = new FileReader(); fr.onload = function () { restoreFrom(fr.result); }; fr.readAsText(f); }
      el.value = "";
    } else if (el.id === "h-date") hol.date = el.value;
    else if (el.id === "h-name") hol.name = el.value;
  });

  render();

  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  }
})();
</script>
</body>
</html>
